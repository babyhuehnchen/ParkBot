name: Release ParkBot
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
concurrency:
  group: parkbot-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        run: |
          python3 .github/scripts/release_metadata.py >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PARKBOT_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PARKBOT_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PARKBOT_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PARKBOT_RELEASE_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing release signing secret: $name. See RELEASE.md."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/parkbot-release.keystore"

      - name: Build and check signed release
        env:
          PARKBOT_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/parkbot-release.keystore
          PARKBOT_RELEASE_STORE_PASSWORD: ${{ secrets.PARKBOT_RELEASE_STORE_PASSWORD }}
          PARKBOT_RELEASE_KEY_ALIAS: ${{ secrets.PARKBOT_RELEASE_KEY_ALIAS }}
          PARKBOT_RELEASE_KEY_PASSWORD: ${{ secrets.PARKBOT_RELEASE_KEY_PASSWORD }}
        run: sh ./gradlew :core:check :app:assembleRelease :app:lintRelease --no-daemon

      - name: Remove release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/parkbot-release.keystore"

      - name: Verify and prepare release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/parkbot-certificate.txt"
          if grep -Eiq 'certificate DN:.*CN=Android Debug([, ]|$)' "$RUNNER_TEMP/parkbot-certificate.txt"; then
            echo "::error::Use a permanent release key, not the Android debug key."
            exit 1
          fi
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/parkbot-manifest.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/parkbot-manifest.txt"; then
            echo "::error::Refusing to publish a debuggable APK."
            exit 1
          fi
          grep -Fq "package: name='tf.dodoapps.parkbot' versionCode='$VERSION_CODE' versionName='$VERSION'" "$RUNNER_TEMP/parkbot-manifest.txt"
          mkdir -p release-assets
          cp "$apk" "release-assets/ParkBot-$VERSION.apk"
          cp "releases/$RELEASE_TAG.md" release-assets/RELEASE-NOTES.md
          cd release-assets
          sha256sum "ParkBot-$VERSION.apk" > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ParkBot-release-${{ steps.version.outputs.version }}
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ParkBot-release-lint
          path: app/build/reports/lint-results-release.html

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ParkBot-release-${{ needs.build.outputs.version }}
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$BUILD_COMMIT" ]; then
              echo "::error::The release tag points to a different commit. Choose a new version."
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::This release already exists. Increase the app version before publishing again."
            exit 1
          fi
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" "ParkBot-$VERSION.apk" SHA256SUMS.txt \
            --target "$BUILD_COMMIT" --title "ParkBot $VERSION" --notes-file RELEASE-NOTES.md
